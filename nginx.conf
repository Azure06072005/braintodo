server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # SPA: mọi route không khớp file tĩnh đều trả index.html (app hiện chưa
    # dùng client-side routing, nhưng để sẵn cho khi cần).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Asset có hash trong tên file (Vite build) -> cache dài hạn an toàn.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}