[project]
name = "braintodo"
version = "0.1.0"
description = "BrainTodo API"
requires-python = ">=3.12"

dependencies = [
    "fastapi",
    "uvicorn",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.vercel]
entrypoint = "src.braintodo.main:app"