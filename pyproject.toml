[project]
name = "braintodo"
version = "0.1.0"
description = "BrainTodo API"
requires-python = ">=3.12"

dependencies = [
    "fastapi",
    "uvicorn",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[tool.vercel]
entrypoint = "src.braintodo.main:app"